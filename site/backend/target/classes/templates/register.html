<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        #mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>📝 Criar Conta</h1>
    <form id="registerForm">
        <input type="text" id="nome" placeholder="Nome (sem acentos)" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="senha" placeholder="Senha (mínimo 6 caracteres)" required minlength="6">
        <button type="submit">Criar Conta</button>
    </form>
    
    <div id="mensagem"></div>
    
    <div class="login-link">
        <p>Já tem conta? <a href="/login">Faça login</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const mensagem = document.getElementById('mensagem');
            
            // Validação simples
            if (!nome || !email || !senha) {
                showMessage('❌ Preencha todos os campos!', 'error');
                return;
            }
            
            if (senha.length < 6) {
                showMessage('❌ A senha deve ter pelo menos 6 caracteres!', 'error');
                return;
            }
            
            // Limpar mensagem anterior
            mensagem.innerHTML = '';
            mensagem.className = '';
            
            // Desabilitar botão durante o processamento
            const button = document.querySelector('button[type="submit"]');
            const originalText = button.textContent;
            button.textContent = 'Processando...';
            button.disabled = true;
            
            try {
                // Criar objeto de dados
                const data = {
                    nome: nome,
                    email: email,
                    senha: senha
                };
                
                // Fazer requisição
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8'
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    // Mostrar sucesso
                    showMessage(`✅ ${result.mensagem} Redirecionando...`, 'success');
                    
                    // Redirecionar para login após 2 segundos
                    setTimeout(() => {
                        window.location.href = '/login?registered=true';
                    }, 2000);
                    
                } else {
                    const errorText = await response.text();
                    let errorMsg = '❌ Erro ao criar conta';
                    
                    try {
                        const errorJson = JSON.parse(errorText);
                        errorMsg = `❌ ${errorJson.erro || errorJson.message || errorText}`;
                    } catch {
                        errorMsg = `❌ ${errorText}`;
                    }
                    
                    showMessage(errorMsg, 'error');
                }
                
            } catch (error) {
                showMessage(`❌ Erro de conexão: ${error.message}`, 'error');
            } finally {
                // Restaurar botão
                button.textContent = originalText;
                button.disabled = false;
            }
        });
        
        function showMessage(text, type) {
            const mensagem = document.getElementById('mensagem');
            mensagem.innerHTML = text;
            mensagem.className = type;
            
            // Rolagem suave para a mensagem
            mensagem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // Opcional: Remover acentos automaticamente do nome
        document.getElementById('nome').addEventListener('input', function(e) {
            let value = e.target.value;
            // Remove acentos
            value = value.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            e.target.value = value;
        });
    </script>
</body>
</html>
