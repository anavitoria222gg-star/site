<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            border-left: 4px solid #dc3545;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            border-left: 4px solid #28a745;
            display: none;
        }
        .test-info {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            border-left: 4px solid #2196f3;
        }
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Login</h2>
        
        <!-- 🔥 FORMULÁRIO COM CSRF TOKEN -->
        <form method="POST" th:action="@{/login}">
            <!-- Campo CSRF OBRIGATÓRIO -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            
            <input type="email" name="username" placeholder="📧 Email" required autofocus>
            <input type="password" name="password" placeholder="🔒 Senha" required>
            <button type="submit">🚀 Entrar</button>
        </form>
        
        <!-- Mensagens de erro/sucesso -->
        <div id="errorMessage" class="error" th:if="${param.error}">
            ❌ Email ou senha inválidos!
        </div>
        <div id="successMessage" class="success" th:if="${param.logout}">
            ✅ Logout realizado com sucesso!
        </div>
        
        <div class="test-info">
            <p><strong>👑 Usuários para teste:</strong></p>
            <p><strong>Admin:</strong> admin@test.com / admin123</p>
            <p><strong>User:</strong> user@test.com / user123</p>
            <p style="margin-top: 10px; font-size: 12px; color: #666;">
                <em>Use estes usuários para testar diferentes níveis de acesso</em>
            </p>
        </div>
        
        <div class="links">
            <a href="/register">📝 Criar conta</a> | 
            <a href="/">🏠 Página Inicial</a> |
            <a href="/api/test">🔧 Testar API</a>
        </div>
    </div>

    <script>
        console.log('🔧 Login page loaded');
        console.log('📝 Formulário configurado para Spring Security');
        console.log('🔐 CSRF Token:', document.querySelector('input[name="_csrf"]').value.substring(0, 20) + '...');
        
        // Animações
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#007bff';
                this.style.boxShadow = '0 0 0 3px rgba(0,123,255,0.1)';
            });
            input.addEventListener('blur', function() {
                this.style.borderColor = '#ddd';
                this.style.boxShadow = 'none';
            });
        });
        
        // Mostrar credenciais de teste
        const testUsers = [
            {email: 'admin@test.com', password: 'admin123', role: 'ADMIN'},
            {email: 'user@test.com', password: 'user123', role: 'USER'}
        ];
        
        console.log('🧪 Usuários de teste disponíveis:');
        testUsers.forEach(user => {
            console.log(`   ${user.role}: ${user.email} / ${user.password}`);
        });
    </script>
</body>
</html>
