<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA Stats</title><style>body{font-family:Arial,sans-serif;background:#0b1020;color:#fff;margin:0;padding:24px}main{max-width:900px;margin:auto}.search{display:flex;gap:8px}input{flex:1;padding:14px;border-radius:8px;border:0;font-size:16px}button{padding:14px 20px;border:0;border-radius:8px;background:#e85d04;color:#fff;font-weight:bold}#results{margin-top:24px;display:grid;gap:12px}.card{background:#151c33;padding:16px;border-radius:12px;cursor:pointer}.tag{color:#9fb3ff;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{background:#151c33;padding:12px;border-radius:10px}</style></head><body><main><h1>🏀 NBA Stats</h1><p>Pesquise um jogador ou time da NBA.</p><div class="search"><input id="q" placeholder="Ex.: Lakers ou Stephen Curry"><button onclick="go()">Buscar</button></div><div id="results"></div></main><script>const r=document.querySelector('#results');async function go(){const q=document.querySelector('#q').value;if(!q)return;r.innerHTML='Buscando...';try{const d=await fetch('/api/search?q='+encodeURIComponent(q)).then(x=>x.json());r.innerHTML='';d.players.forEach(p=>r.innerHTML+=`<div class="card" onclick="player(${p.id})"><span class="tag">JOGADOR</span><h3>${p.full_name}</h3></div>`);d.teams.forEach(t=>r.innerHTML+=`<div class="card" onclick="team(${t.id})"><span class="tag">TIME</span><h3>${t.full_name}</h3></div>`);if(!r.innerHTML)r.innerHTML='Nenhum resultado encontrado.'}catch(e){r.innerHTML='Erro ao buscar dados.'}}async function player(id){r.innerHTML='Carregando jogador...';const d=await fetch('/api/player/'+id).then(x=>x.json());let h='<h2>Últimos 5 jogos</h2><div class="grid">';for(const[k,v]of Object.entries(d.last5_average))h+=`<div class="stat"><b>${k}</b><br>${v}</div>`;h+='</div>';r.innerHTML=h}async function team(id){r.innerHTML='Carregando time...';const d=await fetch('/api/team/'+id).then(x=>x.json());let h='<h2>🏆 Líderes do time</h2>';for(const[k,list]of Object.entries(d.leaders)){h+=`<div class="card"><h3>${k}</h3>`+list.map(x=>`<div>${x.PLAYER_NAME} — ${x[Object.keys(x).slice(-1)[0]]}</div>`).join('')+'</div>'}r.innerHTML=h}</script></body></html>
